    <script>
      // Ignore WebSocket / HMR disconnection errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason).includes('vite:ws') ||
           String(event.reason).includes('without opened'))
        ) {
          event.preventDefault();
        }
      });
    </script>
